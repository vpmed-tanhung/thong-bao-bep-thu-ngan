name: Tao ung dung Thu ngan Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "desktop-app/**"
      - "quay.html"
      - ".github/workflows/build-thu-ngan-windows.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop-app

    steps:
      - name: Tai ma nguon
        uses: actions/checkout@v4

      - name: Cai Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop-app/package-lock.json

      - name: Cai thu vien
        run: npm ci

      - name: Kiem tra ma nguon
        run: npm run check

      - name: Tao file cai dat Windows
        run: npm run dist

      - name: Luu file EXE
        uses: actions/upload-artifact@v4
        with:
          name: Thu-ngan-Windows
          path: desktop-app/dist/*.exe
          if-no-files-found: error
          retention-days: 30
