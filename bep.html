<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bếp báo món">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <title>Bếp · Báo món</title>
  <script defer src="./pwa-install.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          boxShadow: { soft: "0 18px 45px rgba(15, 23, 42, 0.12)" }
        }
      }
    };
  </script>
  <style>
    html { -webkit-tap-highlight-color: transparent; }
    body { min-height: 100dvh; }
    button { touch-action: manipulation; }
    .toast-enter { animation: toast-in .22s ease-out; }
    @keyframes toast-in {
      from { opacity: 0; transform: translate(-50%, 12px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 antialiased">
  <main class="mx-auto min-h-[100dvh] max-w-5xl px-4 pb-10 pt-5 sm:px-6">
    <header class="mb-5 rounded-3xl bg-slate-900 p-5 text-white shadow-soft sm:p-7">
      <div class="flex flex-wrap items-start justify-between gap-4">
        <div>
          <p class="text-sm font-bold uppercase tracking-[0.22em] text-amber-300">Khu vực bếp</p>
          <h1 class="mt-1 text-3xl font-black sm:text-4xl">Báo món cho thu ngân</h1>
        </div>
        <div class="flex flex-col items-end gap-2">
          <div id="connectionBadge" class="flex items-center gap-2 rounded-full bg-slate-800 px-4 py-2 text-sm font-bold">
            <span id="connectionDot" class="h-2.5 w-2.5 rounded-full bg-amber-400"></span>
            <span id="connectionText">Đang kết nối…</span>
          </div>
          <button id="installAppButton" type="button" class="hidden rounded-full bg-amber-400 px-4 py-2 text-sm font-black text-slate-950 shadow-md transition hover:bg-amber-300 active:scale-95">
            📲 CÀI VÀO ĐIỆN THOẠI
          </button>
        </div>
      </div>
    </header>

    <section aria-labelledby="menuTitle">
      <div class="mb-4 flex items-end justify-between gap-4">
        <div>
          <h2 id="menuTitle" class="text-xl font-black sm:text-2xl">Danh sách món</h2>
          <p class="mt-1 text-sm text-slate-600">Trạng thái được đồng bộ ngay trên các thiết bị.</p>
        </div>
        <div class="flex shrink-0 flex-wrap justify-end gap-2">
          <button id="resetAllButton" type="button" class="rounded-full bg-sky-600 px-4 py-1.5 text-sm font-extrabold text-white shadow-sm transition hover:bg-sky-700 active:scale-95 disabled:cursor-wait disabled:opacity-60">
            ↻ RESET TOÀN BỘ MÓN
          </button>
          <span id="lowCount" class="rounded-full bg-amber-100 px-3 py-1.5 text-sm font-extrabold text-amber-800">0 loại bánh sắp hết</span>
          <span id="outCount" class="rounded-full bg-red-100 px-3 py-1.5 text-sm font-extrabold text-red-700">0 món đang hết</span>
        </div>
      </div>

      <div id="itemGrid" class="space-y-6"></div>
    </section>

    <section class="mt-7 rounded-3xl border-2 border-slate-300 bg-white p-5 shadow-sm" aria-labelledby="operationTitle">
      <div class="mb-4">
        <p class="text-sm font-bold uppercase tracking-wider text-slate-500">Thông báo vận hành</p>
        <h2 id="operationTitle" class="mt-1 text-2xl font-black">Đóng khu vực</h2>
      </div>
      <div class="grid gap-4 sm:grid-cols-2">
        <button id="closeRiceCounterButton" type="button" class="min-h-20 rounded-2xl bg-amber-500 px-5 py-4 text-xl font-black text-slate-950 shadow-lg shadow-amber-500/20 transition hover:bg-amber-400 active:scale-[0.98] disabled:cursor-wait disabled:opacity-60">
          ĐÓNG QUẦY CƠM
        </button>
        <button id="closeKitchenButton" type="button" class="min-h-20 rounded-2xl bg-slate-900 px-5 py-4 text-xl font-black text-white shadow-lg shadow-slate-900/20 transition hover:bg-slate-800 active:scale-[0.98] disabled:cursor-wait disabled:opacity-60">
          ĐÓNG BẾP
        </button>
      </div>
    </section>

    <section class="mt-6 rounded-2xl border border-slate-200 bg-white p-4 text-sm text-slate-600 shadow-sm">
      <p class="font-bold text-slate-800">Cách dùng nhanh</p>
      <p class="mt-1 leading-6">Món có số lượng: dùng nút − / + hoặc nhập trực tiếp. Cháo giữ cách báo hết/có lại như trước.</p>
    </section>
  </main>

  <div id="toast" class="pointer-events-none fixed bottom-5 left-1/2 z-50 hidden w-[calc(100%-2rem)] max-w-md -translate-x-1/2 rounded-2xl px-5 py-4 text-center font-bold text-white shadow-2xl" role="status" aria-live="polite"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
    import {
      getDatabase,
      onValue,
      push,
      ref,
      serverTimestamp,
      update
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";

    // ============================================================
    // CẤU HÌNH: Dán đúng Firebase Web App config của bạn vào đây.
    // Hai file bep.html và quay.html phải dùng cùng một cấu hình.
    // ============================================================
    const firebaseConfig = {
      apiKey: "AIzaSyC4Qn8Gql5iJuXNYn0pdobamxtDQyJzly0",
      authDomain: "thong-bao-bep.firebaseapp.com",
      databaseURL: "https://thong-bao-bep-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "thong-bao-bep",
      storageBucket: "thong-bao-bep.firebasestorage.app",
      messagingSenderId: "151352401372",
      appId: "1:151352401372:web:f88f82a0783c391b31c319"
    };

    // Đổi mã này nếu có nhiều cửa hàng. Hai file phải dùng cùng STORE_ID.
    const STORE_ID = "cua-hang-01";
    const LOW_STOCK_LIMIT = 4;
    const KITCHEN_STATUS_ID = "__kitchen-closed";

    const MENU_GROUPS = [
      {
        title: "Món theo suất",
        kind: "quantity",
        items: [
          { id: "banh-cuon", name: "bánh cuốn", icon: "🥟" },
          { id: "banh-bao", name: "bánh bao", icon: "◉" }
        ]
      },
      {
        title: "Sợi",
        kind: "toggle",
        items: [
          { id: "bun", name: "bún", icon: "🍜" },
          { id: "pho", name: "phở", icon: "♨️" },
          { id: "banh-da", name: "bánh đa", icon: "🥣" }
        ]
      },
      {
        title: "Topping",
        kind: "toggle",
        items: [
          { id: "thit-lon", name: "thịt lợn", icon: "🐷" },
          { id: "thit-bo", name: "thịt bò", icon: "🐮" },
          { id: "thit-ga", name: "thịt gà", icon: "🐔" }
        ]
      },
      {
        title: "Cháo",
        kind: "toggle",
        items: [
          { id: "chao-bo", name: "cháo bò", icon: "🥣" },
          { id: "chao-tim", name: "cháo tim", icon: "🥣" },
          { id: "chao-lon", name: "cháo lợn", icon: "🥣" }
        ]
      }
    ];
    const ITEM_LIST = MENU_GROUPS.flatMap((group) => group.items);
    const QUANTITY_ITEMS = MENU_GROUPS
      .filter((group) => group.kind === "quantity")
      .flatMap((group) => group.items);
    const QUANTITY_ITEM_IDS = new Set(QUANTITY_ITEMS.map((item) => item.id));

    const itemGrid = document.querySelector("#itemGrid");
    const outCount = document.querySelector("#outCount");
    const lowCount = document.querySelector("#lowCount");
    const connectionBadge = document.querySelector("#connectionBadge");
    const connectionDot = document.querySelector("#connectionDot");
    const connectionText = document.querySelector("#connectionText");
    const resetAllButton = document.querySelector("#resetAllButton");
    const closeRiceCounterButton = document.querySelector("#closeRiceCounterButton");
    const closeKitchenButton = document.querySelector("#closeKitchenButton");
    const toast = document.querySelector("#toast");

    let database;
    let storeRef;
    let itemState = {};
    let kitchenClosed = false;
    let operationPending = false;
    let toastTimer;
    const pendingItems = new Set();

    function hasValidConfig() {
      return !Object.values(firebaseConfig).some((value) =>
        typeof value !== "string" || value.includes("DAN_") || value.includes("TEN_")
      );
    }

    function setConnection(mode, text) {
      const styles = {
        online: ["bg-emerald-500", "bg-emerald-900"],
        offline: ["bg-red-400", "bg-red-900"],
        waiting: ["bg-amber-400", "bg-slate-800"]
      };
      const [dotClass, badgeClass] = styles[mode] || styles.waiting;
      connectionDot.className = `h-2.5 w-2.5 rounded-full ${dotClass}`;
      connectionBadge.className = `flex items-center gap-2 rounded-full px-4 py-2 text-sm font-bold ${badgeClass}`;
      connectionText.textContent = text;
    }

    function showToast(message, isError = false) {
      window.clearTimeout(toastTimer);
      toast.textContent = message;
      toast.className = `toast-enter pointer-events-none fixed bottom-5 left-1/2 z-50 w-[calc(100%-2rem)] max-w-md -translate-x-1/2 rounded-2xl px-5 py-4 text-center font-bold text-white shadow-2xl ${isError ? "bg-red-600" : "bg-slate-900"}`;
      toastTimer = window.setTimeout(() => toast.classList.add("hidden"), 2600);
    }

    function getQuantity(itemId) {
      const value = itemState[itemId]?.quantity;
      return typeof value === "number" && Number.isFinite(value)
        ? Math.max(0, Math.floor(value))
        : null;
    }

    function getVietnamDayKey(timestamp = Date.now()) {
      const parts = new Intl.DateTimeFormat("en-US", {
        timeZone: "Asia/Ho_Chi_Minh",
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }).formatToParts(new Date(timestamp));
      const values = Object.fromEntries(parts.map((part) => [part.type, part.value]));
      return `${values.year}-${values.month}-${values.day}`;
    }

    function autoOpenKitchenForNewDay() {
      const kitchenStatus = itemState[KITCHEN_STATUS_ID];
      if (!storeRef || operationPending || kitchenStatus?.outOfStock !== true) return;
      if (typeof kitchenStatus.updatedAt !== "number") return;
      if (getVietnamDayKey(kitchenStatus.updatedAt) !== getVietnamDayKey()) {
        resetAllItems(true);
      }
    }

    function renderOperationState() {
      resetAllButton.disabled = operationPending;
      resetAllButton.textContent = operationPending
        ? "ĐANG CẬP NHẬT…"
        : kitchenClosed
          ? "↻ MỞ BẾP & RESET TOÀN BỘ"
          : "↻ RESET TOÀN BỘ MÓN";
      resetAllButton.className = `rounded-full px-4 py-1.5 text-sm font-extrabold text-white shadow-sm transition active:scale-95 disabled:cursor-wait disabled:opacity-60 ${
        kitchenClosed ? "bg-emerald-600 hover:bg-emerald-700" : "bg-sky-600 hover:bg-sky-700"
      }`;

      closeRiceCounterButton.disabled = kitchenClosed || operationPending;
      closeKitchenButton.disabled = kitchenClosed || operationPending;
      closeRiceCounterButton.className = `min-h-20 rounded-2xl px-5 py-4 text-xl font-black shadow-lg transition active:scale-[0.98] disabled:cursor-not-allowed ${
        kitchenClosed
          ? "bg-slate-700 text-slate-400 shadow-none"
          : "bg-amber-500 text-slate-950 shadow-amber-500/20 hover:bg-amber-400 disabled:opacity-60"
      }`;
      closeKitchenButton.className = `min-h-20 rounded-2xl px-5 py-4 text-xl font-black shadow-lg transition active:scale-[0.98] disabled:cursor-not-allowed ${
        kitchenClosed
          ? "bg-slate-700 text-slate-400 shadow-none"
          : "bg-slate-900 text-white shadow-slate-900/20 hover:bg-slate-800 disabled:opacity-60"
      }`;
      closeKitchenButton.textContent = kitchenClosed ? "BẾP ĐÃ ĐÓNG" : "ĐÓNG BẾP";
    }

    function renderItems() {
      itemGrid.replaceChildren();
      renderOperationState();
      const totalOut = ITEM_LIST.filter((item) =>
        QUANTITY_ITEM_IDS.has(item.id)
          ? getQuantity(item.id) === 0
          : itemState[item.id]?.outOfStock === true
      ).length;
      const totalLow = QUANTITY_ITEMS.filter((item) => {
        const quantity = getQuantity(item.id);
        return quantity !== null && quantity > 0 && quantity <= LOW_STOCK_LIMIT;
      }).length;
      outCount.textContent = `${totalOut} món đang hết`;
      lowCount.textContent = `${totalLow} loại bánh sắp hết`;

      MENU_GROUPS.forEach((group) => {
        const section = document.createElement("section");
        const heading = document.createElement("h3");
        heading.className = "mb-3 text-lg font-black text-slate-700 sm:text-xl";
        heading.textContent = group.title;
        const grid = document.createElement("div");
        grid.className = "grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3";

        group.items.forEach((item) => {
          const isPending = pendingItems.has(item.id);
          const quantity = group.kind === "quantity" ? getQuantity(item.id) : null;
          const isOut = group.kind === "quantity"
            ? quantity === 0
            : itemState[item.id]?.outOfStock === true;
          const isLow = quantity !== null && quantity > 0 && quantity <= LOW_STOCK_LIMIT;
          const card = document.createElement("article");
          card.className = `rounded-3xl border-2 p-4 shadow-sm transition ${
            kitchenClosed
              ? "border-slate-700 bg-slate-800"
              : isOut
              ? "border-red-400 bg-red-50"
              : isLow
                ? "border-amber-400 bg-amber-50"
                : "border-white bg-white"
          }`;

          const top = document.createElement("div");
          top.className = "mb-4 flex items-center justify-between gap-3";

          const identity = document.createElement("div");
          identity.className = "flex min-w-0 items-center gap-3";

          const icon = document.createElement("span");
          icon.className = `grid h-12 w-12 shrink-0 place-items-center rounded-2xl text-2xl ${kitchenClosed ? "bg-slate-700 grayscale" : "bg-slate-100"}`;
          icon.textContent = item.icon;

          const name = document.createElement("h4");
          name.className = `truncate text-xl font-black capitalize sm:text-2xl ${kitchenClosed ? "text-slate-400" : "text-slate-900"}`;
          name.textContent = item.name;
          identity.append(icon, name);

          const status = document.createElement("span");
          status.className = `shrink-0 rounded-full px-3 py-1 text-xs font-black ${
            kitchenClosed
              ? "bg-slate-700 text-slate-400"
              : isOut
              ? "bg-red-600 text-white"
              : isLow
                ? "bg-amber-500 text-slate-950"
                : quantity === null && group.kind === "quantity"
                  ? "bg-slate-200 text-slate-700"
                  : "bg-emerald-100 text-emerald-700"
          }`;
          status.textContent = kitchenClosed
            ? "ĐÃ KHÓA"
            : group.kind === "quantity"
            ? quantity === null
              ? "CHƯA NHẬP"
              : isOut
                ? "ĐANG HẾT"
                : isLow
                  ? "SẮP HẾT"
                  : "ĐANG CÓ"
            : isOut ? "ĐANG HẾT" : "ĐANG CÓ";
          top.append(identity, status);

          if (group.kind === "quantity") {
            const quantityLabel = document.createElement("p");
            quantityLabel.className = `mb-2 text-center text-sm font-bold uppercase tracking-wider ${kitchenClosed ? "text-slate-500" : "text-slate-500"}`;
            quantityLabel.textContent = "Số suất còn lại";

            const controls = document.createElement("div");
            controls.className = "grid grid-cols-[3.5rem_1fr_3.5rem] gap-2";

            const minusButton = document.createElement("button");
            minusButton.type = "button";
            minusButton.disabled = kitchenClosed || isPending || quantity === null || quantity <= 0;
            minusButton.className = `min-h-14 rounded-xl text-3xl font-black transition active:scale-95 disabled:cursor-not-allowed ${kitchenClosed ? "bg-slate-700 text-slate-500" : "bg-slate-800 text-white disabled:opacity-35"}`;
            minusButton.textContent = "−";
            minusButton.setAttribute("aria-label", `Giảm một suất ${item.name}`);
            minusButton.addEventListener("click", () => changeItemQuantity(item, Math.max(0, quantity - 1)));

            const input = document.createElement("input");
            input.type = "number";
            input.min = "0";
            input.max = "9999";
            input.inputMode = "numeric";
            input.disabled = kitchenClosed || isPending;
            input.value = quantity ?? "";
            input.placeholder = "0";
            input.className = `min-h-14 min-w-0 rounded-xl border-2 px-2 text-center text-3xl font-black outline-none ${kitchenClosed ? "border-slate-700 bg-slate-900 text-slate-500" : "border-slate-300 bg-white focus:border-sky-500 disabled:opacity-60"}`;
            input.setAttribute("aria-label", `Số suất ${item.name}`);
            input.addEventListener("change", () => {
              if (input.value.trim() === "") return renderItems();
              changeItemQuantity(item, input.value);
            });
            input.addEventListener("keydown", (event) => {
              if (event.key === "Enter") input.blur();
            });

            const plusButton = document.createElement("button");
            plusButton.type = "button";
            plusButton.disabled = kitchenClosed || isPending;
            plusButton.className = `min-h-14 rounded-xl text-3xl font-black transition active:scale-95 disabled:cursor-not-allowed ${kitchenClosed ? "bg-slate-700 text-slate-500" : "bg-emerald-600 text-white disabled:opacity-50"}`;
            plusButton.textContent = "+";
            plusButton.setAttribute("aria-label", `Tăng một suất ${item.name}`);
            plusButton.addEventListener("click", () => changeItemQuantity(item, (quantity ?? 0) + 1));

            controls.append(minusButton, input, plusButton);
            card.append(top, quantityLabel, controls);
          } else {
            const button = document.createElement("button");
            button.type = "button";
            button.disabled = kitchenClosed || isPending;
            button.className = `min-h-20 w-full rounded-2xl px-4 py-4 text-xl font-black shadow-lg transition active:scale-[0.98] disabled:cursor-not-allowed ${
              kitchenClosed
                ? "bg-slate-700 text-slate-500 shadow-none"
                : isOut
                  ? "bg-emerald-600 text-white shadow-emerald-600/20 hover:bg-emerald-700 disabled:opacity-60"
                  : "bg-red-600 text-white shadow-red-600/20 hover:bg-red-700 disabled:opacity-60"
            }`;
            button.textContent = kitchenClosed ? "ĐÃ KHÓA" : isPending ? "ĐANG GỬI…" : isOut ? "✓ BÁO ĐÃ CÓ LẠI" : "! BÁO HẾT";
            button.addEventListener("click", () => changeItemStatus(item, !isOut));
            card.append(top, button);
          }
          grid.append(card);
        });

        section.append(heading, grid);
        itemGrid.append(section);
      });
    }

    function buildQuantityEvent(previousQuantity, nextQuantity, itemName) {
      if (nextQuantity === 0 && previousQuantity !== 0) {
        return { type: "OUT_OF_STOCK", level: "", message: `Hết ${itemName}.` };
      }
      if (
        nextQuantity > 0 &&
        nextQuantity <= LOW_STOCK_LIMIT &&
        (previousQuantity === null || previousQuantity === 0 || previousQuantity > nextQuantity)
      ) {
        return {
          type: "OUT_OF_STOCK",
          level: "LOW_STOCK",
          message: `Sắp hết ${itemName}, còn ${nextQuantity} suất.`
        };
      }
      if (previousQuantity === 0 && nextQuantity > LOW_STOCK_LIMIT) {
        return { type: "BACK_IN_STOCK", level: "", message: `Có lại ${itemName}.` };
      }
      return null;
    }

    async function changeItemQuantity(item, requestedQuantity) {
      if (!storeRef || kitchenClosed || pendingItems.has(item.id)) return;
      const parsedQuantity = Math.floor(Number(requestedQuantity));
      if (!Number.isFinite(parsedQuantity)) {
        showToast("Số lượng không hợp lệ.", true);
        return;
      }

      const nextQuantity = Math.min(9999, Math.max(0, parsedQuantity));
      const previousQuantity = getQuantity(item.id);
      if (previousQuantity === nextQuantity) return;

      pendingItems.add(item.id);
      renderItems();

      const quantityEvent = buildQuantityEvent(previousQuantity, nextQuantity, item.name);

      const userId = getAuth().currentUser?.uid || "unknown";
      const updates = {
        [`items/${item.id}`]: {
          name: item.name,
          quantity: nextQuantity,
          outOfStock: nextQuantity === 0,
          updatedAt: serverTimestamp(),
          updatedBy: userId
        }
      };

      if (quantityEvent) {
        const eventRef = push(ref(database, `stores/${STORE_ID}/events`));
        updates[`events/${eventRef.key}`] = {
          type: quantityEvent.type,
          itemId: item.id,
          name: item.name,
          message: quantityEvent.message,
          createdAt: serverTimestamp(),
          createdBy: userId
        };
        if (quantityEvent.level) updates[`events/${eventRef.key}`].level = quantityEvent.level;
        if (quantityEvent.speechMessage) {
          updates[`events/${eventRef.key}`].speechMessage = quantityEvent.speechMessage;
        }
      }

      try {
        await update(storeRef, updates);
        showToast(`Đã cập nhật ${item.name}: ${nextQuantity} suất`);
      } catch (error) {
        console.error(error);
        showToast("Không cập nhật được số lượng. Kiểm tra mạng hoặc Firebase.", true);
      } finally {
        pendingItems.delete(item.id);
        renderItems();
      }
    }

    async function changeItemStatus(item, nextOutOfStock) {
      if (!storeRef || kitchenClosed || pendingItems.has(item.id)) return;
      pendingItems.add(item.id);
      renderItems();

      const eventRef = push(ref(database, `stores/${STORE_ID}/events`));
      const type = nextOutOfStock ? "OUT_OF_STOCK" : "BACK_IN_STOCK";
      const message = nextOutOfStock
        ? `Hết ${item.name}.`
        : `Có lại ${item.name}.`;
      const userId = getAuth().currentUser?.uid || "unknown";

      const updates = {};
      updates[`items/${item.id}`] = {
        name: item.name,
        outOfStock: nextOutOfStock,
        updatedAt: serverTimestamp(),
        updatedBy: userId
      };
      updates[`events/${eventRef.key}`] = {
        type,
        itemId: item.id,
        name: item.name,
        message,
        createdAt: serverTimestamp(),
        createdBy: userId
      };

      try {
        await update(storeRef, updates);
        showToast(nextOutOfStock ? `Đã báo hết ${item.name}` : `Đã báo ${item.name} có lại`);
      } catch (error) {
        console.error(error);
        showToast("Không gửi được thông báo. Kiểm tra mạng hoặc Firebase.", true);
      } finally {
        pendingItems.delete(item.id);
        renderItems();
      }
    }

    async function sendOperationalEvent(button, type, message, successMessage) {
      if (!storeRef || button.disabled) return;
      button.disabled = true;
      const originalText = button.textContent;
      button.textContent = "ĐANG GỬI…";
      const eventRef = push(ref(database, `stores/${STORE_ID}/events`));
      const userId = getAuth().currentUser?.uid || "unknown";

      try {
        await update(storeRef, {
          [`events/${eventRef.key}`]: {
            type,
            itemId: type.toLowerCase(),
            name: successMessage,
            message,
            createdAt: serverTimestamp(),
            createdBy: userId
          }
        });
        showToast(successMessage);
      } catch (error) {
        console.error(error);
        showToast("Không gửi được thông báo. Kiểm tra mạng hoặc Firebase.", true);
      } finally {
        button.disabled = false;
        button.textContent = originalText;
      }
    }

    async function closeKitchen() {
      if (!storeRef || kitchenClosed || operationPending) return;

      operationPending = true;
      renderItems();
      const eventRef = push(ref(database, `stores/${STORE_ID}/events`));
      const userId = getAuth().currentUser?.uid || "unknown";

      try {
        await update(storeRef, {
          [`items/${KITCHEN_STATUS_ID}`]: {
            name: "trạng thái bếp",
            outOfStock: true,
            updatedAt: serverTimestamp(),
            updatedBy: userId
          },
          [`events/${eventRef.key}`]: {
            type: "CLOSE_KITCHEN",
            itemId: "close_kitchen",
            name: "Đóng bếp",
            message: "Đóng bếp.",
            createdAt: serverTimestamp(),
            createdBy: userId
          }
        });
      } catch (error) {
        console.error(error);
        showToast("Không đóng được bếp. Kiểm tra mạng hoặc Firebase.", true);
      } finally {
        operationPending = false;
        renderItems();
      }
    }

    async function resetAllItems(isAutomatic = false) {
      if (!storeRef || operationPending) return;

      operationPending = true;
      renderItems();
      const userId = getAuth().currentUser?.uid || "unknown";
      const updates = {};
      const eventRef = push(ref(database, `stores/${STORE_ID}/events`));

      MENU_GROUPS.forEach((group) => {
        group.items.forEach((item) => {
          updates[`items/${item.id}`] = {
            name: item.name,
            outOfStock: false,
            updatedAt: serverTimestamp(),
            updatedBy: userId
          };
        });
      });
      updates[`items/${KITCHEN_STATUS_ID}`] = {
        name: "trạng thái bếp",
        outOfStock: false,
        updatedAt: serverTimestamp(),
        updatedBy: userId
      };
      updates[`events/${eventRef.key}`] = {
        type: "BACK_IN_STOCK",
        level: "RESET_MENU",
        itemId: "reset_menu",
        name: "Reset toàn bộ món",
        message: "Reset toàn bộ món.",
        createdAt: serverTimestamp(),
        createdBy: userId
      };

      try {
        await update(storeRef, updates);
      } catch (error) {
        console.error(error);
        showToast("Không reset được món. Kiểm tra mạng hoặc Firebase.", true);
      } finally {
        operationPending = false;
        renderItems();
      }
    }

    async function start() {
      renderItems();

      if (!hasValidConfig()) {
        setConnection("offline", "Chưa cấu hình Firebase");
        showToast("Hãy dán Firebase config vào file bep.html.", true);
        return;
      }

      try {
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        database = getDatabase(app);
        await signInAnonymously(auth);
        storeRef = ref(database, `stores/${STORE_ID}`);

        onValue(ref(database, ".info/connected"), (snapshot) => {
          setConnection(snapshot.val() === true ? "online" : "offline", snapshot.val() === true ? "Đã kết nối" : "Mất kết nối");
        });

        onValue(
          ref(database, `stores/${STORE_ID}/items`),
          (snapshot) => {
            itemState = snapshot.val() || {};
            kitchenClosed = itemState[KITCHEN_STATUS_ID]?.outOfStock === true;
            renderItems();
            autoOpenKitchenForNewDay();
          },
          (error) => {
            console.error(error);
            showToast("Không đọc được trạng thái món. Kiểm tra Database Rules.", true);
          }
        );
      } catch (error) {
        console.error(error);
        setConnection("offline", "Lỗi Firebase");
        showToast("Kết nối Firebase thất bại. Kiểm tra config và Anonymous Auth.", true);
      }
    }

    closeRiceCounterButton.addEventListener("click", () => {
      sendOperationalEvent(
        closeRiceCounterButton,
        "CLOSE_RICE_COUNTER",
        "Đóng quầy cơm.",
        "Đã báo đóng quầy cơm"
      );
    });
    closeKitchenButton.addEventListener("click", () => {
      closeKitchen();
    });
    resetAllButton.addEventListener("click", () => resetAllItems(false));
    window.setInterval(autoOpenKitchenForNewDay, 60_000);
    start();
  </script>
</body>
</html>
